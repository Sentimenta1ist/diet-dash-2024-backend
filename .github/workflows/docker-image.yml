name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            sentimentaly/diet-dash-backend:latest
  deploy:
      needs: build-and-push
      runs-on: ubuntu-latest
      steps:
        - name: Debug SSH key
          run: |
            echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"
            echo "SSH_PRIVATE_KEY starts with: ${SSH_PRIVATE_KEY:0:20}"
          env:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  
        - name: Deploy to server
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.SERVER_IP }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            debug: true
            script: |
              cd /home/ubuntu/diet-dash  # Укажи правильный путь к docker-compose.yml
              docker-compose pull
              docker-compose up -d
