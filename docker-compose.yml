version: '3.8'

volumes:
  postgres_data:

networks:
  my_network:
    driver: bridge

services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diet-dash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d diet-dash"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my_network
