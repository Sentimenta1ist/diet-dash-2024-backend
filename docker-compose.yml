version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diet-dash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d diet-dash" ]
      interval: 10s
      timeout: 10s
      retries: 24
    networks:
      - my_network

  diet-dash:
    image: diet-dash-image
    container_name: diet-dash-backend
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SERVER_SSL_KEY_STORE=/etc/ssl/certs/keystore.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=password
      - SERVER_SSL_KEY_STORE_TYPE=PKCS12
      - SERVER_SSL_KEY_ALIAS=tomcat
      - SERVER_PORT=8443
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "443:8443"  # Exposing port 443 on host machine to 8443 on the container
    volumes:
      - ./src/main/resources/keystore.p12:/etc/ssl/certs/keystore.p12  # Mount the keystore file
    networks:
      - my_network


networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:
