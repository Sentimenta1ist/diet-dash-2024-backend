version: '3.8'

volumes:
  postgres_data:

networks:
  my_network:
    driver: bridge

services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diet-dash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d diet-dash"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my_network

  diet-dash:
    image: diet-dash
    container_name: diet-dash-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - my_network

  frontend:
    image: diet-dash-frontend
    container_name: diet-dash-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - my_network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      diet-dash:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - my_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: always
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      nginx:
        condition: service_started
    networks:
      - my_network

  certbot-init:
    image: certbot/certbot
    container_name: certbot_init
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot \
      --email ivanenko.dev@gmail.com --agree-tos --no-eff-email \
      --force-renewal -d dev.diet-dash.com && \
      nginx -s reload"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      nginx:
        condition: service_started
    networks:
      - my_network
