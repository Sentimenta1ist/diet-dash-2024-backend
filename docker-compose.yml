version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diet-dash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d diet-dash"]
      interval: 10s
      timeout: 10s
      retries: 24
    networks:
      - my_network

  diet_dash:
    image: diet-dash-image
    container_name: diet-dash-backend
    environment:
      - SPRING_PROFILES_ACTIVE=local
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - my_network

volumes:
  postgres_data:

networks:
  my_network:
    driver: bridge