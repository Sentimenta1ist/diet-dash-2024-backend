events {}

http {
    server {
        listen 80;
        server_name dev.diet-dash.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name dev.diet-dash.com;

        ssl_certificate /etc/letsencrypt/live/dev.diet-dash.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.diet-dash.com/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        # Обслуживаем React SPA
        location / {
            try_files $uri /index.html;
        }

        # Прокси запросов на бекенд
        location /api/ {
            proxy_pass http://diet-dash:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
