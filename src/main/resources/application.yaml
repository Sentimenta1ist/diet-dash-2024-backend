spring:
  application:
    name: diet-dash

  datasource:
    url: ${postgres-uri}
    username: ${postgres-user}
    password: ${postgres-password}

  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: ${spring.liquibase.default-schema}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.batch_size: 64
        order_updates: true
        order_inserts: true
    hibernate:
      ddl-auto: validate

  mustache:
    servlet:
      expose-request-attributes: true

  liquibase:
    liquibase-schema: public
    parameters:
      schema: ${spring.liquibase.default-schema}

  mail:
    host: smtp.gmail.com
    port: 587
    username: diet.dash.agent@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${port}

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
  api-docs:
    path: /api/v3/api-docs
  webjars:
    prefix: /api/webjars

logging:
  level:
    root: ${log-level-app:}
    org.springframework.security: INFO

mailtrap:
  api:
    token: ${MAILTRAP_API_TOKEN}
    endpoint: "https://send.api.mailtrap.io/api/send"