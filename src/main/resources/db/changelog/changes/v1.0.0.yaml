databaseChangeLog:
  - changeSet:
      id: "0"
      author: diet-dash-dev
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE SCHEMA IF NOT EXISTS PUBLIC;
  - changeSet:
      id: "20250220-0"
      author: diet-dash-dev
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: login
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: confirmation_token
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false

        - createTable:
            tableName: profile
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: age
                  type: INTEGER
              - column:
                  name: gender
                  type: VARCHAR(10)
              - column:
                  name: height
                  type: INTEGER
              - column:
                  name: weight
                  type: DOUBLE PRECISION
              - column:
                  name: waist
                  type: INTEGER
              - column:
                  name: hips
                  type: INTEGER
              - column:
                  name: goal_weight
                  type: INTEGER
              - column:
                  name: activity
                  type: SMALLINT
              - column:
                  name: body_mass_index
                  type: DOUBLE PRECISION
              - column:
                  name: daily_calorie_norm
                  type: INTEGER
              - column:
                  name: selected_calorie_limit
                  type: INTEGER
              - column:
                  name: daily_protein_limit
                  type: INTEGER
              - column:
                  name: daily_fat_limit
                  type: INTEGER
              - column:
                  name: daily_carbs_limit
                  type: INTEGER
              - column:
                  name: daily_protein_percentage
                  type: DOUBLE PRECISION
              - column:
                  name: daily_fat_percentage
                  type: DOUBLE PRECISION
              - column:
                  name: daily_carbs_percentage
                  type: DOUBLE PRECISION
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_profile_user
                    references: app_user(id)

        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: calories
                  type: FLOAT
              - column:
                  name: proteins
                  type: FLOAT
              - column:
                  name: fats
                  type: FLOAT
              - column:
                  name: carbs
                  type: FLOAT
              - column:
                  name: lang
                  type: VARCHAR(10)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_product_user
                    references: app_user(id)

        - createTable:
            tableName: ration
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: date
                  type: DATE
              - column:
                  name: profile_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ration_profile
                    references: profile(id)

        - createTable:
            tableName: meal
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: time
                  type: TIME
              - column:
                  name: grams
                  type: INTEGER
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_meal_product
                    references: product(id)
              - column:
                  name: ration_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_meal_ration
                    references: ration(id)
  - changeSet:
      id: "20250223-1"
      author: diet-dash-dev
      changes:
        - dropColumn:
            tableName: product
            columnName: lang
  - changeSet:
      id: "20250224-1"
      author: diet-dash-dev
      changes:
        - dropForeignKeyConstraint:
            baseTableName: ration
            constraintName: fk_ration_profile
        - addForeignKeyConstraint:
            baseTableName: ration
            baseColumnNames: profile_id
            constraintName: fk_ration_profile
            referencedTableName: profile
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT
        - dropForeignKeyConstraint:
            baseTableName: profile
            constraintName: fk_profile_user
        - addForeignKeyConstraint:
            baseTableName: profile
            baseColumnNames: user_id
            constraintName: fk_profile_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT
  - changeSet:
      id: "20250224-2"
      author: diet-dash-dev
      changes:
        - dropForeignKeyConstraint:
            baseTableName: product
            constraintName: fk_product_user
        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: user_id
            constraintName: fk_product_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT
  - changeSet:
      id: "20250224-6"
      author: diet-dash-dev
      changes:
        - addColumn:
            tableName: product
            columns:
              - column:
                  name: eng_name
                  type: varchar(255)
                  constraints:
                    nullable: true