<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<!--    <link rel="stylesheet" href="styles1.css">-->
</head>
<body>

<div class="fill-bar" id="fillBar">
    <div class="fill-bar-progress" id="fillBarProgress"></div>
</div>

<p>Profile ID: <span th:text="${profileId}"></span></p>

<div class="container">
    <div class="select-panel">
        <select class="js-example-basic-single" name="state" multiple="multiple" style="width: 20%;">
            <!-- Add options here -->
        </select>
        <div>
            <label for="mealDate">Select meal date:</label>
            <input type="date" id="mealDate" name="mealDate" onchange="updateTable()">
        </div>
        <div>
            <label for="mealTime">Select meal time:</label>
            <input type="time" id="mealTime" name="mealTime">
        </div>
        <button id="submitButton">Add this products</button>
    </div>

    <div class="table-container">
        <table id="selectedValues">
            <thead>
            <tr>
                <th>Time</th>
                <th>Meal</th>
            </tr>
            </thead>
            <tbody>
            <!-- Selected values will be displayed here -->
            </tbody>
        </table>
    </div>
</div>

<script src="../static/js/diet.js"></script>

</body>
</html>
