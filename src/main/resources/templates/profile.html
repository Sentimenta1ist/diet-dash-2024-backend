<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
<form id="heightWeightForm">
    <label for="height">Імʼя:</label>
    <input type="text" id="name" name="name" th:value="${profile.getName()}" required>
    <br>
    <label for="age">Вік:</label>
    <input type="number" id="age" name="age" th:value="${profile.getAge()}">
    <br>
    <label for="sexSelect">Стать:</label>
    <select id="sexSelect" name="sexSelect" th:value="${profile.getSex()}">
        <option value="man">Чоловік</option>
        <option value="woman">Жінка</option>
    </select>
    <br>
    <p>Дієтичні дані:</p>
    <label for="height">Ріст(см):</label>
    <input type="number" id="height" name="height" th:value="${profile.getHeight()}">
    <br>
    <label for="weight">Вага (кг):</label>
    <input type="number" id="weight" name="weight" th:value="${profile.getWeight()}">
    <br>
    <label for="weight">Талія (см):</label>
    <input type="number" id="talia" name="talia" th:value="${profile.getTalia()}">
    <br>
    <label for="weight">Бедра (см):</label>
    <input type="number" id="bedra" name="bedra" th:value="${profile.getBedra()}">
    <br>
    <label for="weightAim">Цільова вага (кг):</label> <!-- Added label for weight aim -->
    <input type="number" id="weightAim" name="weightAim" th:value="${profile.getWeightAim()}">
    <p> Дієтичні дані: </p>
    <label for="limitCal">Рекомендований ліміт калорій :</label> <!-- Added label for weight aim -->
    <br>
    <label for="limitCal">Ліміт калорій :</label> <!-- Added label for weight aim -->
    <input type="number" id="limitCal" name="limitCal" th:value="${profile.getLimitCal()}">
    <br>
    <br>
    <label>Ліміт БЖВ:</label>
    <div id="carbsForm">
        <label for="carbs">Вуглеводи (г):</label>
        <input type="number" id="carbs" name="carbs" th:value="${profile.getCarbs()}">
    </div>

    <div id="proteinsForm">
        <label for="proteins">Білки (г):</label>
        <input type="number" id="proteins" name="proteins" th:value="${profile.getProteins()}">
    </div>

    <div id="fatsForm">
        <label for="fats">Жири (г):</label>
        <input type="number" id="fats" name="fats" th:value="${profile.getFats()}">
    </div>
    <br>
    <label for="activity">Актвиність:</label>
    <select id="activity" name="activity" th:value="${profile.getActivity()}">
        <option value="1">Без активності</option>
        <option value="2">Сидячий</option>
        <option value="3">Невелика активність</option>
        <option value="4">Помірна активність</option>
        <option value="5">Висока активність</option>
        <option value="6">Дуже активність</option>
    </select>
    <br>
    <button type="submit">Зберегти зміни</button>
    <button id="viewDietButton">View Diet</button>
</form>
<script src="../../../../../diet-dash/src/main/resources/static/profile.js"></script>
</body>
</html>
