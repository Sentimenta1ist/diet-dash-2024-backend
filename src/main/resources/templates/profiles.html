<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profiles</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</head>
<body>
<p th:text="${userId}"></p>
<p th:text="${username}"></p>
<form id="profileForm">
    <label for="profileForm">Імʼя:</label>
    <input type="text" id="nameInput" name="nameInput" required>
    <button id="createAndOpenProfile" type="submit">Створити новий профіль</button>
</form>
<br>
<select class="profiles" name="state" style="width: 400px;" >
    <option value="">Виберіть профіль</option>
</select>

<button id="openProfile">Обрати профіль</button>

<form th:action="@{/logout}" method="post">
    <input type="submit" value="Sign Out"/>
</form>

<script src="../../../../../diet-dash/src/main/resources/templates/js/profiles.js"></script>

</body>
</html>
